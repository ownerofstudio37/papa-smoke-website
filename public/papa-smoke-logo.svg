<svg width="900" height="180" viewBox="0 0 900 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Papa Smoke logo</title>
  <desc id="desc">Hot pink LED-style Papa Smoke wordmark with smoke rising from the O.</desc>
  <defs>
    <filter id="pink-glow" x="-15%" y="-35%" width="130%" height="170%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1 0 0 0 0 0.04 0 0 0 0 0.45 0 0 0 0.9 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="10" dy="13" stdDeviation="3" flood-color="#150008" flood-opacity="0.8"/>
    </filter>
    <linearGradient id="face" x1="44" y1="50" x2="806" y2="129" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff55b8"/>
      <stop offset="0.48" stop-color="#ff1493"/>
      <stop offset="1" stop-color="#ff5a42"/>
    </linearGradient>
    <linearGradient id="smoke" x1="520" y1="4" x2="600" y2="74" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ccfff7"/>
      <stop offset="1" stop-color="#39f5d2" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect x="16" y="25" width="868" height="130" rx="13" fill="#070707"/>
  <rect x="20" y="29" width="860" height="122" rx="10" stroke="#ff2a9a" stroke-opacity="0.28"/>
  <g filter="url(#soft-shadow)" opacity="0.5">
    <text x="46" y="118" font-family="Arial Black, Arial, sans-serif" font-size="86" font-weight="900" letter-spacing="2" fill="#18020b">PAPA SMOKE</text>
  </g>
  <g filter="url(#pink-glow)">
    <text x="42" y="113" font-family="Arial Black, Arial, sans-serif" font-size="86" font-weight="900" letter-spacing="2" fill="url(#face)">PAPA SMOKE</text>
  </g>
  <g stroke="url(#smoke)" stroke-width="7" stroke-linecap="round" opacity="0.9">
    <path d="M558 50C540 33 572 26 558 9"/>
    <path d="M578 52C600 34 566 25 588 10"/>
    <path d="M567 43C580 30 552 22 568 7"/>
  </g>
</svg>
