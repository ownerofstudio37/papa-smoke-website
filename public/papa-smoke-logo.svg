<svg width="930" height="180" viewBox="0 0 930 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Papa Smoke logo</title>
  <desc id="desc">Hot pink LED-style Papa Smoke wordmark with smoke rising from the O.</desc>
  <defs>
    <filter id="pink-glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1 0 0 0 0 0.05 0 0 0 0 0.42 0 0 0 0.85 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="face" x1="42" y1="42" x2="860" y2="137" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff4ab2"/>
      <stop offset="0.45" stop-color="#ff0f8b"/>
      <stop offset="1" stop-color="#ff5a3d"/>
    </linearGradient>
    <linearGradient id="smoke" x1="424" y1="10" x2="496" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d9fff8"/>
      <stop offset="1" stop-color="#34f5d2" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect x="15" y="24" width="900" height="132" rx="14" fill="#080808"/>
  <rect x="19" y="28" width="892" height="124" rx="10" stroke="#ff2a9a" stroke-opacity="0.28"/>
  <g opacity="0.42" transform="translate(9 13)" fill="#1a070f">
    <text x="36" y="119" font-family="Arial Black, Arial, sans-serif" font-size="86" font-weight="900" letter-spacing="4">PAPA SM</text>
    <circle cx="555" cy="87" r="34"/>
    <text x="610" y="119" font-family="Arial Black, Arial, sans-serif" font-size="86" font-weight="900" letter-spacing="4">KE</text>
  </g>
  <g filter="url(#pink-glow)">
    <text x="34" y="116" font-family="Arial Black, Arial, sans-serif" font-size="86" font-weight="900" letter-spacing="4" fill="url(#face)">PAPA SM</text>
    <text x="610" y="116" font-family="Arial Black, Arial, sans-serif" font-size="86" font-weight="900" letter-spacing="4" fill="url(#face)">KE</text>
    <circle cx="555" cy="87" r="34" fill="none" stroke="url(#face)" stroke-width="16"/>
    <circle cx="555" cy="87" r="14" fill="#080808"/>
  </g>
  <g stroke="url(#smoke)" stroke-width="7" stroke-linecap="round" opacity="0.92">
    <path d="M551 47C532 30 563 22 549 8"/>
    <path d="M573 49C596 31 560 22 582 9"/>
    <path d="M559 38C572 25 543 19 559 5"/>
  </g>
</svg>
